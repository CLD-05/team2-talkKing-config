apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-analyzer
  labels:
    app: ai-analyzer
spec:
  selector:
    matchLabels:
      app: ai-analyzer
  template:
    metadata:
      labels:
        app: ai-analyzer
    spec:
      containers:
        - name: ai-analyzer
          image: ai-error-analyzer:latest
          ports:
            - containerPort: 8082
              name: http
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 90
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            initialDelaySeconds: 70
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: ai-analyzer-svc
  labels:
    app: ai-analyzer
spec:
  selector:
    app: ai-analyzer
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8082
      name: http
  type: ClusterIP
