# team2-talkKing-config/base/auth-service.yaml
# Base: Auth Deployment + Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  labels:
    app: auth
spec:
  # 💡 1. 인증 서버 가용성 확보를 위한 무중단 배포 전략 명시
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%         # 새 파드를 먼저 25% 비율만큼 더 띄우고
      maxUnavailable: 0%    # 배포 중 기존 가용 파드가 줄어들지 않도록 보장
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
      - name: auth-service
        image: talkking-auth:latest
        ports:
        - containerPort: 8080
          name: http
        envFrom:
        - configMapRef:
            name: talkking-env
        # AWS Secrets Manager 연동 결과물인 K8s Secret 주입
        - secretRef:
            name: talkking-db-secret
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
        # 💡 2. CPU 집약적인 인증 서비스 특성을 고려한 헬스체크 튜닝
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 45  # 초기 구동 속도를 감안해 현실적으로 조절
          periodSeconds: 10
          timeoutSeconds: 3        # 일시적 부하로 인한 네트워크 지연 대기 시간 추가
          failureThreshold: 3      # 3번 연속 실패 시에만 다운된 것으로 판단하고 재시작
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 45
          periodSeconds: 10
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  labels:
    app: auth
spec:
  ports:
  - port: 80               # 💡 3. 타 서비스들이 포트 명시 없이 http://auth-service/ 로 호출할 수 있게 표준 포트(80) 적용
    targetPort: 8080       # 실제 컨테이너의 8080 포트로 포워딩
    protocol: TCP
    name: http
  selector:
    app: auth
  type: ClusterIP