apiVersion: v1
kind: ServiceAccount
metadata:
  name: fis-experiment
  namespace: talkking-dev
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fis-pod-modifier
  namespace: talkking-dev
  annotations:
    # FIS IAM 역할의 권한이 Pod에 주입
    eks.amazonaws.com/role-arn: arn:aws:iam::495599735720:role/team2-talkking-dev-fis-role
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/exec", "pods/status", "namespaces"]
    verbs: ["get", "list", "watch", "delete", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fis-pod-modifier-binding
  namespace: talkking-dev
subjects:
  - kind: ServiceAccount
    name: fis-experiment
    namespace: talkking-dev
roleRef:
  kind: Role
  name: fis-pod-modifier
  apiGroup: rbac.authorization.k8s.io
---
# 💡 EKS 순정 환경에 맞춘 클러스터 레벨 권한 보정
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fis-privileged-cluster-role
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/exec"]
    verbs: ["create", "get", "list", "watch"]
  # 💡 EKS 노드 및 cgroup 제어 프록시를 위한 노드 권한 확보
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["daemonsets", "deployments"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fis-privileged-cluster-role-binding
subjects:
  - kind: ServiceAccount
    name: fis-experiment
    namespace: talkking-dev
roleRef:
  kind: ClusterRole
  name: fis-privileged-cluster-role
  apiGroup: rbac.authorization.k8s.io
