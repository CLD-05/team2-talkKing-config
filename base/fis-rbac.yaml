apiVersion: v1
kind: ServiceAccount
metadata:
  name: fis-experiment
  namespace: talkking-dev
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fis-pod-modifier
  namespace: talkking-dev
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/exec
      - pods/status
      - pods/ephemeralcontainers
    verbs: ["get", "list", "watch", "delete", "create", "patch", "update"]
  - apiGroups: [""]
    resources:
      - configmaps
      - events
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fis-pod-modifier-binding
  namespace: talkking-dev
subjects:
  - kind: ServiceAccount
    name: fis-experiment
    namespace: talkking-dev
roleRef:
  kind: Role
  name: fis-pod-modifier
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fis-privileged-cluster-role
rules:
  - apiGroups: [""]
    resources:
      - namespaces
      - nodes
      - nodes/proxy
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - daemonsets
      - deployments
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fis-privileged-cluster-role-binding
subjects:
  - kind: ServiceAccount
    name: fis-experiment
    namespace: talkking-dev
roleRef:
  kind: ClusterRole
  name: fis-privileged-cluster-role
  apiGroup: rbac.authorization.k8s.io
