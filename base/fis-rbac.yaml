apiVersion: v1
kind: ServiceAccount
metadata:
  name: fis-experiment
  namespace: talkking-dev
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fis-pod-modifier
  namespace: talkking-dev
rules:
  - apiGroups: [""]
    # 💡 pods/exec에 접근하여 내부 명령을 실행해야 하므로 둘 다 유지합니다.
    resources: ["pods", "pods/exec"]
    # 💡 핵심: "create"를 추가해야 Latency와 CPU 부하 실험 시 Pod 내부로 진입(Exec)할 수 있습니다!
    verbs: ["get", "list", "watch", "delete", "create"] 
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fis-pod-modifier-binding
  namespace: talkking-dev
subjects:
  - kind: ServiceAccount
    name: fis-experiment
    namespace: talkking-dev
roleRef:
  kind: Role
  name: fis-pod-modifier
  apiGroup: rbac.authorization.k8s.io