# Base: Frontend Deployment + Service
# team2-talkKing-config/base/frontend-service.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-service
  labels:
    app: frontend
spec:
  # 💡 1. HPA 가동 및 버전 교체 시 정적 페이지 공백을 막기 위한 롤링 업데이트 명시
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0%    # 배포 중에도 기존 프론트엔드 파드 수를 100% 유지하여 무중단 보장
  # HPA 제어권과의 충돌(Drift) 방지를 위해 spec.replicas는 생략합니다.
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: nginx:stable-alpine # 기본 이미지 (Overlay에서 실제 ECR 주소로 패치 예정)
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        # 💡 2. Nginx의 가벼운 구동 특성을 반영한 헬스체크 고도화
        livenessProbe:
          httpGet:
            path: /         # Nginx 내부에 가벼운 healthz.html 등을 심어두면 베스트입니다.
            port: 80
          initialDelaySeconds: 15 # Nginx는 매우 빨리 켜지므로 구동 대기 시간을 줄여 배포 속도를 최적화
          periodSeconds: 10
          timeoutSeconds: 2       # 일시적 정적 자원 과부하 대기 시간 추가
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10       # 너무 빈번한 I/O 방지를 위해 5초에서 10초로 주기를 완화
          timeoutSeconds: 2
          successThreshold: 1
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  labels:
    app: frontend
spec:
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: frontend
  type: ClusterIP # 대외 노출은 차후 Ingress 단에서 이 서비스를 라우팅하도록 엮어주면 됩니다.