# prod Ingress (AWS ALB)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: talkking-prod-ingress # 💡 2. 프로젝트 이름 반영
  namespace: talkking-prod    # 💡 2. 운영 네임스페이스 통일
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    # 운영 도메인 보호를 위한 HTTPS 강제 및 ACM 인증서 연동
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-northeast-2:xxxxxxxxxxxx:certificate/xxxx-xxxx-xxxx
    # ★ [하드닝] WebSocket 실시간 연결 유지를 위한 타임아웃 연장 및 세션 고정 튜닝
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=3600
    alb.ingress.kubernetes.io/target-group-attributes: stickiness.enabled=true,stickiness.type=lb_cookie,stickiness.lb_cookie.duration_seconds=86400
spec:
  rules:
  - host: api.talkking-service.com # 💡 2. 실제 운영 도메인 규칙 반영
    http:
      paths:
      - path: /api/v1/auth
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 80 # 💡 1. 핵심: 수정된 서비스 외부 노출 포트(80)에 바인딩
      - path: /ws
        pathType: Prefix
        backend:
          service:
            name: chat-service
            port:
              number: 80 # 💡 1. 핵심: 수정된 서비스 외부 노출 포트(80)에 바인딩
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80 # 💡 기존 서비스 포트(80) 유지