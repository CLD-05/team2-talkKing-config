# prod ExternalSecret (AWS Secrets Manager)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: talkking-db-secret   # 💡 3. 프로젝트 이름 규칙 일치화
  namespace: talkking-prod   # 💡 3. 운영계 네임스페이스 통일
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-secretstore    # 운영팀이 글로벌하게 관리하는 ClusterSecretStore 타겟팅 유지
    kind: ClusterSecretStore
  target:
    # 💡 1. 핵심: base 레이어의 모든 디플로이먼트가 주입받는 Secret 이름인 'talkking-db-secret'과 100% 일치해야 합니다!
    name: talkking-db-secret
    creationPolicy: Owner
  data:
  - secretKey: SPRING_DATASOURCE_PASSWORD
    remoteRef:
      key: prod/talkking/db  # 💡 2. AWS Secrets Manager의 실제 보안 컨텍스트 키 경로 동기화
      property: password
  - secretKey: SPRING_DATA_REDIS_PASSWORD
    remoteRef:
      key: prod/talkking/redis # 💡 2. AWS Secrets Manager의 실제 보안 컨텍스트 키 경로 동기화
      property: password
