apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-service
spec:
  template:
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: chat
      containers:
        - name: chat-service
          envFrom:
            - configMapRef:
                name: talkking-global-env
            - configMapRef:
                name: talkking-env
            - secretRef:
                name: talkking-db-secret
            - secretRef:
                name: rabbitmq-secret
