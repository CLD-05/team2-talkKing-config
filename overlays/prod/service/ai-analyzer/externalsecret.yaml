# overlays/prod/service/ai-analyzer/externalsecret.yaml
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ai-error-analyzer-secret
  namespace: talkking-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretstore
    kind: ClusterSecretStore
  target:
    name: ai-error-analyzer-secret
    creationPolicy: Owner
  data:
    - secretKey: SLACK_GENERAL_WEBHOOK_URL
      remoteRef:
        key: team2-talkking/prod/ai-error-analyzer
        property: SLACK_GENERAL_WEBHOOK_URL
    - secretKey: SLACK_CRITICAL_WEBHOOK_URL
      remoteRef:
        key: team2-talkking/prod/ai-error-analyzer
        property: SLACK_CRITICAL_WEBHOOK_URL
    - secretKey: SLACK_WARNING_WEBHOOK_URL
      remoteRef:
        key: team2-talkking/prod/ai-error-analyzer
        property: SLACK_WARNING_WEBHOOK_URL
    - secretKey: SLACK_INFO_WEBHOOK_URL
      remoteRef:
        key: team2-talkking/prod/ai-error-analyzer
        property: SLACK_INFO_WEBHOOK_URL
    - secretKey: SLACK_CODEX_QUEUE_WEBHOOK_URL
      remoteRef:
        key: team2-talkking/prod/ai-error-analyzer
        property: SLACK_CODEX_QUEUE_WEBHOOK_URL
    - secretKey: SLACK_CODEX_BOT_TOKEN
      remoteRef:
        key: team2-talkking/prod/ai-error-analyzer
        property: SLACK_CODEX_BOT_TOKEN
    - secretKey: SLACK_CODEX_CHANNEL_ID
      remoteRef:
        key: team2-talkking/prod/ai-error-analyzer
        property: SLACK_CODEX_CHANNEL_ID
    - secretKey: GEMINI_API_KEY
      remoteRef:
        key: team2-talkking/prod/ai-error-analyzer
        property: GEMINI_API_KEY
    - secretKey: GEMINI_MODEL
      remoteRef:
        key: team2-talkking/prod/ai-error-analyzer
        property: GEMINI_MODEL
