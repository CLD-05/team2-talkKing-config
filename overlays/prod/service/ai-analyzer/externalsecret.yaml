# overlays/prod/service/ai-analyzer/externalsecret.yaml
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ai-error-analyzer-secret
  namespace: talkking-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretstore # 👈 prod 환경의 공통 SecretStore 이름 사용
    kind: ClusterSecretStore
  target:
    name: ai-error-analyzer-secret
    creationPolicy: Owner
  data:
    - secretKey: SLACK_WEBHOOK_URL
      remoteRef:
        key: team2-talkking/prod/ai-error-analyzer # 👈 dev 대신 prod 금고 경로!
        property: SLACK_WEBHOOK_URL
    - secretKey: GEMINI_API_KEY
      remoteRef:
        key: team2-talkking/prod/ai-error-analyzer
        property: GEMINI_API_KEY
    - secretKey: GEMINI_MODEL
      remoteRef:
        key: team2-talkking/prod/ai-error-analyzer
        property: GEMINI_MODEL
