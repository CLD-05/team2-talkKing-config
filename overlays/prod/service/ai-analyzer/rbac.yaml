apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-error-analyzer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-error-analyzer-read
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-error-analyzer-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ai-error-analyzer-read
subjects:
  - kind: ServiceAccount
    name: ai-error-analyzer
    namespace: talkking-prod
