apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: talkking-notification-keda
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: talkking-notification
  minReplicas: 2
  maxReplicas: 10
  cooldownPeriod: 300
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: "teamn-prod-msk-broker1.xxxxxx.ap-northeast-2.amazonaws.com:9092,teamn-prod-msk-broker2.xxxxxx.ap-northeast-2.amazonaws.com:9092"
        consumerGroup: notification-group
        topic: chat.message.created
        lagThreshold: "100"
