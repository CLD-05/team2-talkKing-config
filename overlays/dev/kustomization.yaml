apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: talkking-dev

resources:
  - ../../base
  - global-config.yaml
  - middleware-endpoints.yaml
  - credential-secrets.yaml
  - network-ingress.yaml
  - services/auth/deployment-hpa.yaml
  - services/chat/deployment-hpa.yaml
  - services/frontend/deployment-hpa.yaml

images:
  - name: talkking-chat
    newName: 495599735720.dkr.ecr.ap-northeast-2.amazonaws.com/team2-talkking/chat-service
    newTag: latest
  
  - name: talkking-notification
    newName: 495599735720.dkr.ecr.ap-northeast-2.amazonaws.com/team2-talkking/notification-service
    newTag: latest