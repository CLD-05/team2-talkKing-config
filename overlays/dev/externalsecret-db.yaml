apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secretsmanager
  namespace: talkking-dev # 💡 개발 환경 네임스페이스 명시
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-2 # 우리 팀이 사용하는 AWS 서울 리전 고정
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: talkking-app-secret # 💡 가독성을 위해 이름을 프로젝트 명칭과 일치화
  namespace: talkking-dev
spec:
  refreshInterval: "1h" # 1시간마다 AWS Secrets Manager와 동기화
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    # 💡 1. 핵심: base 디플로이먼트에 연결해둔 'talkking-db-secret'과 정확히 이름이 일치해야 합니다!
    name: talkking-db-secret 
    creationPolicy: Owner
  dataFrom:
  - extract:
      # ------------------------------------------------------------------
      # [필수 주소] AWS Secrets Manager에 등록한 시크릿 보안 경로 (Secret Name)
      # 💡 개발 환경에 맞춰 AWS에 생성한 실제 시크릿 키 이름을 예시로 명시해 둡니다.
      # ------------------------------------------------------------------
      key: "talkking/dev/database" # 예시: 이 안에 username, password 등이 key-value로 들어있어야 함