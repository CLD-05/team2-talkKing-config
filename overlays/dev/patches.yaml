# dev Patches (Image tags, replicas, resource overrides)
# dev 환경의 각 컨테이너 이미지 태그 및 환경 세부 튜닝을 처리합니다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: officetalk-dev
spec:
  template:
    spec:
      containers:
      - name: auth-service
        image: xxxxxxxxxxxx.dkr.ecr.ap-northeast-2.amazonaws.com/officetalk-auth:dev-latest # CI가 이 태그를 주입합니다.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-service
  namespace: officetalk-dev
spec:
  template:
    spec:
      containers:
      - name: chat-service
        image: xxxxxxxxxxxx.dkr.ecr.ap-northeast-2.amazonaws.com/officetalk-chat:dev-latest