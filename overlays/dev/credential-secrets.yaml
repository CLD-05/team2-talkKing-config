apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secretsmanager
  namespace: talkking-dev
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-2
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: talkking-app-secret
  namespace: talkking-dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: talkking-db-secret  # 최종적으로 K8s에 생성될 쿠버네티스 Secret 이름
    creationPolicy: Owner
  data:
    # 1. 기존 메인 DB 설정
    - secretKey: SPRING_DATASOURCE_USERNAME
      remoteRef:
        key: team2-talkking/dev/database
        property: username
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: team2-talkking/dev/database
        property: password

    # 2. 추가: 슬랙 알림 이력용 Postgres DB 설정
    - secretKey: ALERT_DB_USERNAME
      remoteRef:
        # 테라폼이 생성한 alert_history_db의 Secrets Manager 이름 (또는 ARN 전체)
        key: "team2-talkking-dev-alert-history-db" 
        property: username
    - secretKey: ALERT_DB_PASSWORD
      remoteRef:
        key: "team2-talkking-dev-alert-history-db"
        property: password