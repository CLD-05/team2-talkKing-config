apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ai-analyzer
  namespace: talkking-dev
  labels:
    release: kube-prometheus-stack
    app: ai-analyzer
spec:
  selector:
    matchLabels:
      app: ai-analyzer
  endpoints:
  - port: http
    path: /actuator/prometheus
    interval: 30s