# overlays/dev/service/ai-analyzer/externalsecret.yaml
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ai-error-analyzer-secret
  namespace: talkking-dev # 👈 기존 ai-error-analyzer에서 팀 표준에 맞게 수정
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager # 👈 dev 환경에 이미 만들어둔 Store 이름으로 수정
    kind: SecretStore
  target:
    name: ai-error-analyzer-secret
    creationPolicy: Owner
  data:
    - secretKey: SLACK_GENERAL_WEBHOOK_URL
      remoteRef:
        key: team2-talkking/dev/ai-error-analyzer
        property: SLACK_GENERAL_WEBHOOK_URL
    - secretKey: SLACK_CRITICAL_WEBHOOK_URL
      remoteRef:
        key: team2-talkking/dev/ai-error-analyzer
        property: SLACK_CRITICAL_WEBHOOK_URL
    - secretKey: SLACK_WARNING_WEBHOOK_URL
      remoteRef:
        key: team2-talkking/dev/ai-error-analyzer
        property: SLACK_WARNING_WEBHOOK_URL
    - secretKey: SLACK_INFO_WEBHOOK_URL
      remoteRef:
        key: team2-talkking/dev/ai-error-analyzer
        property: SLACK_INFO_WEBHOOK_URL
    - secretKey: SLACK_CODEX_QUEUE_WEBHOOK_URL
      remoteRef:
        key: team2-talkking/dev/ai-error-analyzer
        property: SLACK_CODEX_QUEUE_WEBHOOK_URL
    - secretKey: GEMINI_API_KEY
      remoteRef:
        key: team2-talkking/dev/ai-error-analyzer
        property: GEMINI_API_KEY
    - secretKey: GEMINI_MODEL
      remoteRef:
        key: team2-talkking/dev/ai-error-analyzer
        property: GEMINI_MODEL
