apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: team2-rabbitmq-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: rabbitmq
    targetRevision: 16.0.6
    helm:
      values: |
        global:
          security:
            allowInsecureImages: true

        fullnameOverride: rabbitmq-service
        architecture: standalone

        auth:
          username: talkking
          existingPasswordSecret: rabbitmq-secret
          existingSecretPasswordKey: rabbitmq-password

        image:
          registry: docker.io
          repository: bitnamilegacy/rabbitmq
          tag: 4.1.3-debian-12-r1

        readinessProbe:
          enabled: true
          initialDelaySeconds: 180
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 12

        livenessProbe:
          enabled: true
          initialDelaySeconds: 180
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 12

        persistence:
          enabled: false

        service:
          type: ClusterIP

        metrics:
          enabled: true
          serviceMonitor:
            enabled: true
            namespace: monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: talkking-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
