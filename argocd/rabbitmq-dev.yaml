apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: team2-rabbitmq-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: oci://registry-1.docker.io/bitnamicharts
    chart: rabbitmq

    # 실제 최신 차트 버전으로 지정
    targetRevision: 16.0.6

    helm:
      values: |
        global:
          security:
            allowInsecureImages: true
          imageRegistry: docker.io
          imageRepository: bitnamilegacy/rabbitmq
          imageTag: 4.1.3-debian-12-r1

        fullnameOverride: rabbitmq-service

        architecture: standalone

        auth:
          username: talkking
          existingPasswordSecret: rabbitmq-secret
          existingSecretPasswordKey: rabbitmq-password

        # [버전 통일 완료]
        image:
          registry: docker.io
          repository: bitnamilegacy/rabbitmq
          tag: 4.1.3-debian-12-r1

        # ⏱️ 래빗MQ가 완전히 켜질 때까지 쿠버네티스가 차분히 기다려주도록 프로브 지연 추가
        readinessProbe:
          enabled: true
          initialDelaySeconds: 120
        livenessProbe:
          enabled: true
          initialDelaySeconds: 120

        persistence:
          enabled: false

        service:
          type: ClusterIP

        metrics:
          enabled: true

          serviceMonitor:
            enabled: true
            namespace: monitoring

  destination:
    server: https://kubernetes.default.svc
    namespace: talkking-dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true