apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: talkking-prod-ai-error-analyzer
  namespace: talkking-prod
  labels:
    alertmanagerConfig: talkking-prod
    release: kube-prometheus-stack
spec:
  route:
    receiver: ai-error-analyzer
    groupBy:
      - alertname
      - namespace
      - pod
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 3h
  receivers:
    - name: ai-error-analyzer
      webhookConfigs:
        - url: http://ai-analyzer-svc.talkking-prod.svc.cluster.local:80/api/v1/alerts
          sendResolved: true
