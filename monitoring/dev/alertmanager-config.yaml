apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: talkking-dev-ai-error-analyzer
  labels:
    alertmanagerConfig: talkking-dev
spec:
  route:
    receiver: ai-error-analyzer
    groupBy:
      - alertname
      - namespace
      - pod
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 3h
    matchers:
      - name: namespace
        value: talkking-dev
        matchType: =
  receivers:
    - name: ai-error-analyzer
      webhookConfigs:
        - url: http://ai-analyzer-svc.talkking-dev.svc.cluster.local:80/api/v1/alerts
          sendResolved: true
